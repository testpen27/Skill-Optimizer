<div id="emb-kuiz-contoh" lang="ms" role="region" aria-label="Kuiz ringkas">
<style>
#emb-kuiz-contoh, #emb-kuiz-contoh * { box-sizing: border-box; }
#emb-kuiz-contoh { --ink:#3D3033; --bg:#FFFDF7; --pink:#FF6B8B; --pink-lt:#FFE3E8; --red:#DC2626;
  width:100%; max-width:1200px; margin:2rem auto; padding:24px 16px; color:var(--ink); background-color:var(--bg);
  background-image:radial-gradient(#FFC4D0 1.5px, transparent 1.5px); background-size:30px 30px;
  border:4px solid var(--ink); border-radius:1.5rem; box-shadow:0 10px 25px rgba(61,48,51,.15); touch-action:pan-y;
  font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
#emb-kuiz-contoh :is(h2,p,fieldset,legend) { margin:0; padding:0; border:0; }
#emb-kuiz-contoh .badge { display:inline-block; margin-bottom:12px; padding:4px 14px; background:#fff; color:var(--red);
  border:2px solid var(--ink); border-radius:999px; box-shadow:0 3px 0 var(--ink); font-size:.875rem; font-weight:700; }
#emb-kuiz-contoh .card { max-width:760px; margin:0 auto; padding:20px; background:#fff; border:4px solid var(--ink);
  border-radius:1.5rem; box-shadow:6px 6px 0 rgba(61,48,51,.15); }
#emb-kuiz-contoh h2 { font-size:1.375rem; line-height:1.3; margin-bottom:14px; }
#emb-kuiz-contoh .q { margin-bottom:16px; }
#emb-kuiz-contoh legend { font-weight:700; margin-bottom:8px; }
#emb-kuiz-contoh label { display:flex; gap:10px; align-items:center; min-height:44px; padding:8px 12px; margin-bottom:6px;
  border:2px solid var(--ink); border-radius:12px; background:#fff; cursor:pointer; }
#emb-kuiz-contoh input { width:20px; height:20px; accent-color:var(--red); }
#emb-kuiz-contoh label:focus-within { outline:3px solid var(--red); outline-offset:2px; }
#emb-kuiz-contoh .check { min-height:44px; padding:10px 22px; font:inherit; font-weight:700; color:#fff; background:var(--red);
  border:3px solid var(--ink); border-radius:999px; box-shadow:0 4px 0 var(--ink); cursor:pointer; }
#emb-kuiz-contoh .check:active { box-shadow:none; transform:translateY(4px); }
#emb-kuiz-contoh .check:focus-visible { outline:3px solid var(--ink); outline-offset:3px; }
#emb-kuiz-contoh .why { margin-top:6px; padding:8px 12px; background:var(--pink-lt); border-radius:10px; }
#emb-kuiz-contoh .result { margin-top:16px; font-weight:700; }
#emb-kuiz-contoh .src { margin-top:14px; font-size:.875rem; }
@media (max-width:768px) { #emb-kuiz-contoh { margin:1rem auto; border-radius:1rem; } #emb-kuiz-contoh .card { padding:14px; } }
@media (prefers-reduced-motion:reduce) { #emb-kuiz-contoh .check:active { transform:none; } }
</style>
<span class="badge">[Acara atau tarikh]</span>
<div class="card">
<h2>Kuiz ringkas: [tajuk]</h2>
<div class="qs"></div>
<button type="button" class="check">Semak jawapan</button>
<p class="result" role="status" aria-live="polite"></p>
<p class="src">Sumber: [nama sumber rasmi], [tarikh semakan]</p>
</div>
<script>
(function () {
  var root = document.getElementById('emb-kuiz-contoh');
  if (!root || root.dataset.ready) return;
  root.dataset.ready = '1';
  var Q = [
    { q: '[Soalan 1: ganti dengan fakta bersumber]', o: ['Pilihan A', 'Pilihan B', 'Pilihan C'], a: 1, why: '[Penjelasan ringkas 1]' },
    { q: '[Soalan 2: ganti dengan fakta bersumber]', o: ['Pilihan A', 'Pilihan B'], a: 0, why: '[Penjelasan ringkas 2]' }
  ];
  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text) n.textContent = text;
    return n;
  }
  function init() {
    var box = root.querySelector('.qs');
    Q.forEach(function (item, i) {
      var fs = el('fieldset', 'q');
      fs.appendChild(el('legend', '', (i + 1) + '. ' + item.q));
      item.o.forEach(function (text, j) {
        var lab = el('label');
        var inp = document.createElement('input');
        inp.type = 'radio'; inp.name = 'emb-q' + i; inp.value = j;
        lab.appendChild(inp); lab.appendChild(el('span', '', text));
        fs.appendChild(lab);
      });
      var why = el('p', 'why');
      why.hidden = true;
      fs.appendChild(why);
      box.appendChild(fs);
    });
    root.querySelector('.check').addEventListener('click', function () {
      var score = 0;
      root.querySelectorAll('fieldset').forEach(function (fs, i) {
        var picked = fs.querySelector('input:checked');
        var right = picked && Number(picked.value) === Q[i].a;
        if (right) score++;
        var why = fs.querySelector('.why');
        why.textContent = (right ? 'Betul. ' : 'Belum tepat. ') + Q[i].why;
        why.hidden = false;
      });
      root.querySelector('.result').textContent = 'Skor anda: ' + score + ' daripada ' + Q.length;
    });
  }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', init); else init();
})();
</script>
</div>
